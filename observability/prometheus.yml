global:
  scrape_interval: 15s

scrape_configs:
  # The Spring app running in IntelliJ on the host.
  # 5s interval: a provider hang lasts 30s, and at 15s you get two data points
  # and a graph nobody can read. 5s makes the incident actually visible.
  - job_name: paylane
    scrape_interval: 5s
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: postgres
    scrape_interval: 15s
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]