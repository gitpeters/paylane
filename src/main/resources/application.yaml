server:
  port: ${SERVER_PORT:8082}
  compression:
    enabled: true

spring:
  application:
    name: paylane

  # Local credentials come from .env (gitignored), parsed as a properties file.
  # In prod the same PAYLANE_DB_* keys are supplied as real environment variables.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${PAYLANE_DB_URL}
    username: ${PAYLANE_DB_USERNAME}
    password: ${PAYLANE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10

  management:
    endpoints.web.exposure.include: health,info,metrics,prometheus
    metrics.tags.application: paylane
    observations.annotations.enabled: true

  threads:
    virtual:
      # Deliberately off. Virtual threads are a later topic; the naive baseline
      # runs on the platform-thread pool so its limits are visible.
      enabled: false

  flyway:
    enabled: true
    # Default location: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only validates that the entities
      # match it — it never mutates DDL. See docs/conventions.md.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

# Seed generator (active only under the `seed` profile). All money in minor units.
paylane:
  seed:
    transaction-count: 4000000
    merchant-count: 500
    # One merchant holds ~40% of all transactions (a realistic "whale" tenant).
    whale-share: 0.40
    currency: NGN
  provider:
    stub:
      # How long the stub holds a charge open, and how often it declines.
      # Set delay-ms=30000 to reproduce a client timeout against a call that
      # still succeeds server-side. There is no timeout on the caller by design.
      delay-ms: 0
      failure-rate: 0.0
  idempotency:
    # How often expired idempotency keys are purged. Single instance only for now —
    # distributed scheduling (a lock) is a later topic.
    cleanup-interval-ms: 3600000
